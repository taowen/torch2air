[project]
name = "torch2air"
version = "0.1.0"
description = "Export PyTorch matmul-like models to IREE AMD-AIE AIR MLIR."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.9; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
torch-mlir = [
  "torch-mlir>=20250920",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<0.13",
]

[project.scripts]
torch2air = "torch2air.cli:main"

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download-r2.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
